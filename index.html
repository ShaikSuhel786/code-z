<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Drift Detection System | AI MVP</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
      :root {
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --secondary: #10b981;
        --bg-dark: #0f172a;
        --bg-card: rgba(30, 41, 59, 0.7);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --danger: #ef4444;
        --warning: #f59e0b;
        --glass-border: rgba(255, 255, 255, 0.1);
        --glow: 0 0 20px rgba(99, 102, 241, 0.4);
      }

      * { box-sizing: border-box; }

      body, html {
        margin: 0; padding: 0;
        font-family: 'Inter', sans-serif;
        background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
        color: var(--text-main);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      .app-container {
        display: flex; flex-direction: column;
        min-height: 100vh; padding: 2rem;
      }

      /* Glassmorphism Classes */
      .glass-card {
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .glass-card:hover { border-color: rgba(255,255,255,0.2); }

      /* Typography */
      h1, h2, h3 { margin: 0 0 1rem 0; font-weight: 600; }
      .gradient-text {
        background: linear-gradient(90deg, #818cf8, #c084fc);
        -webkit-background-clip: text; color: transparent;
      }
      .text-muted { color: var(--text-muted); }
      .text-sm { font-size: 0.875rem; }

      /* Buttons */
      .btn {
        padding: 0.75rem 1.5rem; border: none; border-radius: 8px;
        font-weight: 500; font-family: 'Inter', sans-serif;
        cursor: pointer; transition: all 0.2s ease;
        display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--primary), #8b5cf6); color: white;
        box-shadow: var(--glow);
      }
      .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(99, 102, 241, 0.6); }

      /* Inputs */
      .input-base {
        width: 100%; padding: 0.75rem 1rem;
        background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border);
        border-radius: 8px; color: white; font-family: inherit; margin-bottom: 1rem;
        transition: border-color 0.2s;
      }
      .input-base:focus { outline: none; border-color: var(--primary); }

      /* Layouts */
      .grid { display: grid; gap: 1.5rem; }
      .grid-cols-2 { grid-template-columns: repeat(2, 1px); grid-template-columns: 1fr 1fr; }
      .flex { display: flex; } .flex-col { flex-direction: column; }
      .items-center { align-items: center; } .justify-between { justify-content: space-between; }
      .justify-center { justify-content: center; }
      .gap-4 { gap: 1rem; } .gap-2 { gap: 0.5rem; }

      /* Dashboard Layout */
      .dashboard-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--glass-border);
      }

      /* Badges */
      .badge {
        padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
      }
      .badge-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
      .badge-warning { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
      .badge-success { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }

      /* Custom Progress Bar Chart */
      .progress-container { width: 100%; background: rgba(255,255,255,0.1); border-radius: 999px; height: 8px; overflow: hidden; margin-top: 0.5rem;}
      .progress-fill { height: 100%; transition: width 1s ease-out; }

      /* Table styling */
      .glass-table { width: 100%; border-collapse: collapse; text-align: left; }
      .glass-table th { padding: 1rem; border-bottom: 1px solid var(--glass-border); color: var(--text-muted); font-weight: 500; }
      .glass-table td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
      .glass-table tr:hover td { background: rgba(255,255,255,0.02); }

      /* Animations */
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.4s ease forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // MOCK DATA & AI DRIFT SIMULATION ENGINE
      const USERS = [
        { id: 's1', username: 'student1', role: 'student', name: 'Alex Johnson' },
        { id: 's2', username: 'student2', role: 'student', name: 'Sarah Williams' },
        { id: 's3', username: 'student3', role: 'student', name: 'Michael Chen' },
        { id: 'i1', username: 'teacher', role: 'instructor', name: 'Prof. Davis' },
        { id: 'a1', username: 'admin', role: 'admin', name: 'System Admin' }
      ];

      const INTERACTIONS = [
        // Alex: Consistent learner (Low Drift)
        { id: 1, studentId: 's1', topic: 'Algebra', correct: true, timeSecs: 45, date: '2023-10-01' },
        { id: 2, studentId: 's1', topic: 'Algebra', correct: true, timeSecs: 50, date: '2023-10-02' },
        { id: 3, studentId: 's1', topic: 'Calculus', correct: true, timeSecs: 120, date: '2023-10-05' },
        { id: 4, studentId: 's1', topic: 'Calculus', correct: true, timeSecs: 110, date: '2023-10-06' },
        
        // Sarah: Experiencing Concept Drift (Started good, now guessing fast and failing)
        { id: 5, studentId: 's2', topic: 'Physics', correct: true, timeSecs: 60, date: '2023-10-01' },
        { id: 6, studentId: 's2', topic: 'Physics', correct: true, timeSecs: 65, date: '2023-10-02' },
        { id: 7, studentId: 's2', topic: 'Quantum', correct: false, timeSecs: 15, date: '2023-10-05' },
        { id: 8, studentId: 's2', topic: 'Quantum', correct: false, timeSecs: 10, date: '2023-10-06' },
        
        // Michael: Struggling conceptually (Requires intervention, moderate drift/dull)
        { id: 9, studentId: 's3', topic: 'Statistics', correct: false, timeSecs: 100, date: '2023-10-01' },
        { id: 10, studentId: 's3', topic: 'Statistics', correct: false, timeSecs: 90, date: '2023-10-02' },
        { id: 11, studentId: 's3', topic: 'Probability', correct: false, timeSecs: 85, date: '2023-10-05' },
        { id: 12, studentId: 's3', topic: 'Probability', correct: true, timeSecs: 15, date: '2023-10-06' },
      ];

      function analyzeStudentDrift(studentId) {
        const studentData = INTERACTIONS.filter(i => i.studentId === studentId);
        if (studentData.length < 4) return { driftScore: 0, accuracy: 100, status: 'Not enough data' };
        
        const mid = Math.floor(studentData.length / 2);
        const baseline = studentData.slice(0, mid);
        const recent = studentData.slice(mid);
        
        const calcAcc = (arr) => arr.filter(i => i.correct).length / arr.length * 100;
        const calcAvgTime = (arr) => arr.reduce((acc, curr) => acc + curr.timeSecs, 0) / arr.length;
        
        const baseAcc = calcAcc(baseline);
        const recAcc = calcAcc(recent);
        const baseTime = calcAvgTime(baseline);
        const recTime = calcAvgTime(recent);
        
        let driftScore = 0;
        if (recAcc < baseAcc) driftScore += (baseAcc - recAcc) * 0.8; 
        if (recTime < baseTime * 0.5) driftScore += 30; // Speeding up + failing = guessing
        
        driftScore = Math.min(Math.max(Math.round(driftScore), 0), 100);
        let status = 'Stable Learning';
        if (driftScore > 60) status = 'Critical Concept Drift';
        else if (driftScore > 30) status = 'Warning: Early Drift Signs';
        
        return { driftScore, baselineAccuracy: baseAcc, recentAccuracy: recAcc, overallAccuracy: calcAcc(studentData), status };
      }

      // SHARED UI COMPONENTS
      const ProgressBar = ({ value, colorMap }) => {
        let color = 'var(--primary)';
        if (colorMap) {
          if (value > 60) color = 'var(--danger)';
          else if (value > 30) color = 'var(--warning)';
          else color = 'var(--secondary)';
        }
        return (
          <div className="progress-container">
            <div className="progress-fill" style={{ width: `${value}%`, background: color }}></div>
          </div>
        );
      };

      const Card = ({ children, title, className = "" }) => (
        <div className={`glass-card ${className}`}>
          {title && <h3 className="text-muted" style={{ marginBottom: '1rem', borderBottom: '1px solid var(--glass-border)', paddingBottom: '0.5rem' }}>{title}</h3>}
          {children}
        </div>
      );

      // DASHBOARDS
      function StudentDashboard({ user, onLogout }) {
        const metrics = useMemo(() => analyzeStudentDrift(user.id), [user.id]);
        return (
          <div className="animate-fade-in" style={{ maxWidth: '800px', margin: '0 auto', width: '100%' }}>
            <div className="dashboard-header">
              <div>
                <h2>Welcome back, <span className="gradient-text">{user.name}</span></h2>
                <p className="text-muted">Student Portal | Concept Drift Analysis</p>
              </div>
              <button className="btn" style={{ background: 'rgba(255,255,255,0.1)', color: 'white' }} onClick={onLogout}>Logout</button>
            </div>
            <div className="grid grid-cols-2">
              <Card title="Your Concept Drift Score">
                <div className="flex flex-col items-center justify-center gap-2" style={{ padding: '1rem 0' }}>
                  <div style={{ fontSize: '3rem', fontWeight: '700', color: metrics.driftScore > 50 ? 'var(--danger)' : 'var(--secondary)' }}>
                    {metrics.driftScore}%
                  </div>
                  <div className={`badge ${metrics.driftScore > 50 ? 'badge-danger' : 'badge-success'}`}>
                    {metrics.status}
                  </div>
                  <ProgressBar value={metrics.driftScore} colorMap={true} />
                  <p className="text-sm text-muted" style={{ marginTop: '1rem', textAlign: 'center' }}>
                    {metrics.driftScore > 50 ? "AI detected a shift in your learning pattern. Make sure you fully grasp concepts before attempting answers." : "You are maintaining consistent conceptual understanding!"}
                  </p>
                </div>
              </Card>
              <Card title="Accuracy Trend">
                <div className="flex justify-between" style={{ marginBottom: '1rem' }}><span>Historical Baseline</span><span style={{ fontWeight: 'bold' }}>{metrics.baselineAccuracy}%</span></div>
                <ProgressBar value={metrics.baselineAccuracy} />
                <div className="flex justify-between" style={{ marginTop: '2rem', marginBottom: '1rem' }}><span>Recent Performance</span><span style={{ fontWeight: 'bold' }}>{metrics.recentAccuracy}%</span></div>
                <ProgressBar value={metrics.recentAccuracy} />
              </Card>
            </div>
          </div>
        );
      }

      function InstructorDashboard({ user, onLogout }) {
        const students = USERS.filter(u => u.role === 'student');
        return (
          <div className="animate-fade-in" style={{ maxWidth: '1000px', margin: '0 auto', width: '100%' }}>
            <div className="dashboard-header">
              <div>
                <h2>Instructor Dashboard</h2>
                <p className="text-muted">Monitor Class Concept Drift and Interventions</p>
              </div>
              <button className="btn" style={{ background: 'rgba(255,255,255,0.1)', color: 'white' }} onClick={onLogout}>Logout</button>
            </div>
            <Card>
              <table className="glass-table">
                <thead><tr><th>Student Name</th><th>Overall Accuracy</th><th>Recent Trend</th><th>AI Drift Risk</th><th>Action</th></tr></thead>
                <tbody>
                  {students.map(s => {
                    const metrics = analyzeStudentDrift(s.id);
                    return (
                      <tr key={s.id}>
                        <td style={{ fontWeight: '500' }}>{s.name}</td>
                        <td>{metrics.overallAccuracy}%</td>
                        <td>{metrics.recentAccuracy < metrics.baselineAccuracy ? '📉 Declining' : '📈 Stable'}</td>
                        <td>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                            <span style={{ width: '40px' }}>{metrics.driftScore}%</span>
                            <div style={{ flex: 1 }}><ProgressBar value={metrics.driftScore} colorMap={true} /></div>
                          </div>
                        </td>
                        <td>
                          {metrics.driftScore > 50 ? <button className="btn text-sm" style={{ background: 'var(--danger)', padding: '0.25rem 0.75rem', color: 'white' }}>Intervene</button> : <span className="text-muted text-sm">On Track</span>}
                        </td>
                      </tr>
                    )
                  })}
                </tbody>
              </table>
            </Card>
          </div>
        );
      }

      function AdminDashboard({ user, onLogout }) {
        const students = USERS.filter(u => u.role === 'student').map(s => ({ ...s, metrics: analyzeStudentDrift(s.id) }));
        const clever = students.filter(s => s.metrics.driftScore < 30 && s.metrics.overallAccuracy > 70);
        const duller = students.filter(s => s.metrics.driftScore >= 30 || s.metrics.overallAccuracy <= 50);

        return (
          <div className="animate-fade-in" style={{ maxWidth: '1200px', margin: '0 auto', width: '100%' }}>
            <div className="dashboard-header">
              <div>
                <h2 className="gradient-text">Admin Analytics Platform</h2>
                <p className="text-muted">Global Institutional Concept Drift Diagnostics</p>
              </div>
              <button className="btn" style={{ background: 'rgba(255,255,255,0.1)', color: 'white' }} onClick={onLogout}>Logout</button>
            </div>
            <div className="grid grid-cols-2">
              <Card title="High Mastery 'Clever' Students (Low Drift)">
                <ul style={{ listStyle: 'none', padding: 0, margin: 0 }}>
                  {clever.map(s => (
                    <li key={s.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '1rem', borderBottom: '1px solid var(--glass-border)' }}>
                      <span>{s.name}</span><span className="badge badge-success">Drift: {s.metrics.driftScore}%</span>
                    </li>
                  ))}
                  {clever.length === 0 && <li className="text-muted">No students in this category.</li>}
                </ul>
              </Card>
              <Card title="At-Risk 'Duller' Students (High Drift / Low Acc)">
                <ul style={{ listStyle: 'none', padding: 0, margin: 0 }}>
                  {duller.map(s => (
                    <li key={s.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '1rem', borderBottom: '1px solid var(--glass-border)' }}>
                      <span>{s.name}</span><span className="badge badge-danger">Drift: {s.metrics.driftScore}%</span>
                    </li>
                  ))}
                   {duller.length === 0 && <li className="text-muted">No students in this category.</li>}
                </ul>
              </Card>
            </div>
          </div>
        );
      }

      // MAIN APP SHELL
      function App() {
        const [user, setUser] = useState(null);
        const [username, setUsername] = useState('');
        const [error, setError] = useState('');

        const handleLogin = (e) => {
          e.preventDefault();
          const found = USERS.find(u => u.username === username);
          if (found) { setUser(found); setError(''); }
          else { setError('Invalid username. Try student1, student2, teacher, or admin.'); }
        };

        if (user) {
          return (
            <div className="app-container">
              {user.role === 'student' && <StudentDashboard user={user} onLogout={() => setUser(null)} />}
              {user.role === 'instructor' && <InstructorDashboard user={user} onLogout={() => setUser(null)} />}
              {user.role === 'admin' && <AdminDashboard user={user} onLogout={() => setUser(null)} />}
            </div>
          );
        }

        return (
          <div className="app-container justify-center items-center">
            <Card className="animate-fade-in" style={{ maxWidth: '400px', width: '100%' }}>
              <h2 style={{ textAlign: 'center', marginBottom: '0.5rem' }} className="gradient-text">ConceptShift AI</h2>
              <p className="text-muted" style={{ textAlign: 'center', marginBottom: '2rem' }}>Drift Detection System Login</p>
              <form onSubmit={handleLogin}>
                <input type="text" className="input-base" placeholder="Username (e.g. student2, teacher, admin)" value={username} onChange={e => setUsername(e.target.value)} />
                {error && <p style={{ color: 'var(--danger)', fontSize: '0.875rem', marginBottom: '1rem' }}>{error}</p>}
                <button type="submit" className="btn btn-primary" style={{ width: '100%' }}>Sign In Securely</button>
              </form>
              <div style={{ marginTop: '2rem', fontSize: '0.875rem' }} className="text-muted">
                <strong>Demo Accounts:</strong><br/>
                • student1 (Low Drift)<br/>
                • student2 (High Drift)<br/>
                • teacher (Instructor)<br/>
                • admin (Admin)
              </div>
            </Card>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
